name: Build SERVPN Android APK & AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Release Keystore
        run: keytool -genkeypair -v -keystore app/servpn.jks -keyalg RSA -keysize 2048 -validity 10000 -alias servpn -storepass servpn2026 -keypass servpn2026 -dname "CN=SERVPN, O=SERVPN, C=RU"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build Signed APK & AAB
        run: gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SERVPN-Release-Files
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/servpn.jks
