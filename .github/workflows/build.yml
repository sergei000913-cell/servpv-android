name: Build SERVPN Android APK & AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Ensure Static Release Keystore
        run: |
          if [ ! -f app/servpn.jks ]; then
            keytool -genkeypair -v -keystore app/servpn.jks -keyalg RSA -keysize 2048 -validity 10000 -alias servpn -storepass servpn2026 -keypass servpn2026 -dname "CN=SERVPN, O=SERVPN, C=RU"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f app/servpn.jks
            git commit -m "Save static release keystore [skip ci]"
            git push
          fi
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Download Official Xray Core AAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/libs
          gh release download -R 2dust/AndroidLibXrayLite -p "*.aar" -O app/libs/libv2ray.aar
          ls -lh app/libs/libv2ray.aar
      - name: Build Signed APK & AAB
        run: gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SERVPN-Release-Files
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/servpn.jks
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SERVPN v1.0.${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
